apiVersion: v1
kind: Pod
metadata:
  name: after-policy
  namespace: opa-demo
  labels:
    run: after-policy
    owner: michael
spec:
  restartPolicy: Never
  containers:
  - name: after-policy
    image: nginxinc/nginx-unprivileged:stable
    ports:
    - containerPort: 8080
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
