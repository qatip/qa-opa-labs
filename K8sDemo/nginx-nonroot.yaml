apiVersion: v1
kind: Pod
metadata:
  name: nginx-nonroot
  namespace: opa-demo
  labels:
    owner: michael
spec:
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
  containers:
    - name: nginx
      image: nginxinc/nginx-unprivileged:stable
      ports:
        - containerPort: 8080